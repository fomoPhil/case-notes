# Debrief x Hermes Agent — profile config
# Lives at: ~/.hermes/profiles/debrief/config.yaml
# Purpose: conversational "second brain" over the Debrief vault, fully local.
# Reuses the already-running LM Studio OpenAI-compatible server (do NOT restart it).
#
# HARD CONSTRAINT discovered at runtime: LM Studio serves gemma-4-12b-it-qat with
# CONTEXT 32000 but PARALLEL 4, so each request only gets ~8000 usable tokens.
# Everything below is tuned to keep a whole task under that per-slot ceiling:
#   - only 3 filesystem tools (small tool-schema footprint)
#   - a short operator prompt
#   - compression disabled (the aux compressor is the same 32K-gated gemma)
# Do NOT change LM Studio to fix this; tune the footprint here instead.

model:
  default: gemma-4-12b-it-qat
  provider: custom
  base_url: http://localhost:1234/v1
  api_key: lm-studio            # LM Studio ignores this; any non-empty value is fine
  api_mode: chat_completions    # LM Studio + gemma emit native OpenAI tool_calls
  context_length: 64000         # clears Hermes's 64K minimum gate (see note above)

# No built-in terminal/file/web/browser tools. The ONLY tools the agent gets are
# the read-only filesystem MCP tools below. This is our read-only guarantee.
toolsets: []

agent:
  reasoning_effort: none        # keep gemma from over-thinking on this chat surface
  max_turns: 20
  system_prompt: |-
    You are Debrief, the private admin assistant to a solo therapist, a second
    brain over the practice vault. You have READ ONLY filesystem access to the
    vault; you cannot create, edit, move, or delete anything.

    Vault layout:
    - Clients/<id>/ (ids like C-0001, C-0002). Each holds _Profile.md (has the
      client name and a frontmatter summary), Treatment-Plan.md (numbered
      goals), and Sessions/ (dated notes, newest = last filename).
    - Interventions/, Themes/, Templates/.

    Rules:
    - Read the actual files before answering; never answer from memory.
    - Client folders are ids, not names. To find a client, read the _Profile.md
      files and match the name field. Never guess a folder id.
    - Quote the vault verbatim for clinical facts (goals, risk wording).
    - If a file or folder is missing or empty (e.g. no session notes yet), say
      so plainly. NEVER invent sessions, goals, homework, or risk wording.
    - Lead with the answer, keep it short, prefer bullets.
    - You draft and summarize; the clinician decides.

# Compression disabled: our tasks are short and run in fresh contexts, so we
# never need to compact history. Disabling also avoids spinning up a second
# gemma instance as the auxiliary compression model. (With the model now served
# at a real 64K context, the old 32K minimum-gate override is no longer needed.)
compression:
  enabled: false

# Clean-room: no cross-session memory bleed, so answers provably come from the
# vault files, not remembered context.
memory:
  memory_enabled: false
  user_profile_enabled: false

# Read-only filesystem MCP, scoped to exactly the DebriefVault root.
# tools.include is a strict whitelist: only these 3 read tools are exposed, both
# to guarantee read-only access AND to keep the tool-schema token cost small
# enough to fit the ~8000-token per-slot window. The server's write tools
# (write_file, edit_file, move_file, create_directory) are never surfaced.
mcp_servers:
  filesystem:
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "/Users/philwoolley/Projects/gemma4hackathon-casenotes/DebriefVault"
    tools:
      include:
        - list_directory
        - read_text_file
        - search_files

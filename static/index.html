<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debrief</title><style>body{font:16px system-ui;margin:0;background:#f5f7f7;color:#172122}main{max-width:760px;margin:40px auto;padding:0 20px}section{background:#fff;border:1px solid #d6dfdd;border-radius:6px;padding:20px;margin:16px 0}textarea{width:100%;min-height:170px;box-sizing:border-box;font:inherit}select,button{font:inherit;padding:9px 12px;margin:8px 6px 0 0}button{background:#146c63;color:white;border:0;border-radius:4px;font-weight:600}button:disabled{opacity:.5}small{color:#536260}.warning{color:#8a3b12}.ok{color:#12623a}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><main><h1>Debrief</h1><p>Local clinician drafts. Every result requires clinician review.</p><section><label>Mode <select id="mode"><option value="voice_journal">Clinician voice journal</option><option value="debrief">Post-session debrief</option></select></label><label> Client <select id="client"><option value="C-0001">Bob (demo)</option><option value="C-0002">Jordan (demo)</option></select></label><textarea id="transcript" placeholder="Paste the local speech transcript here. Example: For Bob, I noticed workplace avoidance came up again. Add this to next session preparation and suggest two CBT questions."></textarea><button id="plan">Create review plan</button><div id="status"></div></section><section id="review" hidden><h2>Review plan</h2><pre id="output"></pre><button id="approve">Approve draft actions</button><div id="result"></div></section></main><script>
let currentPlan; const $=id=>document.getElementById(id); async function call(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
fetch('/api/status').then(r=>r.json()).then(s=>{$('status').innerHTML=`<small>Execution: ${s.mode}. Model: ${s.model}. ${s.live_actions_allowed?'Live macOS actions enabled.':'Demo-only writes enabled.'}</small>`});
$('plan').onclick=async()=>{try{$('plan').disabled=true;currentPlan=await call('/api/plan',{mode:$('mode').value,client_id:$('client').value,transcript:$('transcript').value});$('output').textContent=JSON.stringify(currentPlan,null,2);$('review').hidden=false}catch(e){$('status').innerHTML=`<p class="warning">${e.message}</p>`}finally{$('plan').disabled=false}};
$('approve').onclick=async()=>{try{$('approve').disabled=true;const r=await call('/api/approve',{plan:currentPlan});$('result').innerHTML=`<p class="ok">${r.verification.confirmed?'Verified':'Verification needs review'}: ${r.verification.what_i_see}</p><pre>${JSON.stringify(r.results,null,2)}</pre>`}catch(e){$('result').innerHTML=`<p class="warning">${e.message}</p>`}finally{$('approve').disabled=false}};
</script></body></html>

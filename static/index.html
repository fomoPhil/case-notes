<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debrief</title><style>body{font:16px system-ui;margin:0;background:#f5f7f7;color:#172122}main{max-width:760px;margin:40px auto;padding:0 20px}section{background:#fff;border:1px solid #d6dfdd;border-radius:6px;padding:20px;margin:16px 0}textarea{width:100%;min-height:170px;box-sizing:border-box;font:inherit}select,button{font:inherit;padding:9px 12px;margin:8px 6px 0 0}button{background:#146c63;color:white;border:0;border-radius:4px;font-weight:600}button:disabled{opacity:.5}small{color:#536260}.warning{color:#8a3b12}.ok{color:#12623a}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><main><h1>Debrief</h1><p>Local clinician drafts. Every result requires clinician review.</p><section><label>Mode <select id="mode"><option value="voice_journal">Clinician voice journal</option><option value="debrief">Post-session debrief</option></select></label><label> Client <select id="client"><option value="C-0001">Bob (demo)</option><option value="C-0002">Jordan (demo)</option></select></label><textarea id="transcript" placeholder="Speak using Record, or paste a local speech transcript. Example: For Bob, I noticed workplace avoidance came up again. Add this to next session preparation and suggest two CBT questions."></textarea><button id="record">Record</button><button id="plan">Create review plan</button><div id="status"></div></section><section id="review" hidden><h2>Review plan</h2><pre id="output"></pre><button id="approve">Approve draft actions</button><div id="result"></div></section></main><script>
let currentPlan; const $=id=>document.getElementById(id); async function call(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
fetch('/api/status').then(r=>r.json()).then(s=>{$('status').innerHTML=`<small>Execution: ${s.mode}. Model: ${s.model}. ${s.live_actions_allowed?'Live macOS actions enabled.':'Demo-only writes enabled.'}</small>`});
$('plan').onclick=async()=>{try{$('plan').disabled=true;currentPlan=await call('/api/plan',{mode:$('mode').value,client_id:$('client').value,transcript:$('transcript').value});$('output').textContent=JSON.stringify(currentPlan,null,2);$('review').hidden=false}catch(e){$('status').innerHTML=`<p class="warning">${e.message}</p>`}finally{$('plan').disabled=false}};
$('approve').onclick=async()=>{try{$('approve').disabled=true;const r=await call('/api/approve',{plan:currentPlan});$('result').innerHTML=`<p class="ok">${r.verification.confirmed?'Verified':'Verification needs review'}: ${r.verification.what_i_see}</p><pre>${JSON.stringify(r.results,null,2)}</pre>`}catch(e){$('result').innerHTML=`<p class="warning">${e.message}</p>`}finally{$('approve').disabled=false}};
let audioContext, stream, source, processor, chunks=[]; function wav(samples,rate){const b=new ArrayBuffer(44+samples.length*2),v=new DataView(b);const put=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));put(0,'RIFF');v.setUint32(4,36+samples.length*2,true);put(8,'WAVE');put(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);put(36,'data');v.setUint32(40,samples.length*2,true);samples.forEach((s,i)=>v.setInt16(44+i*2,Math.max(-1,Math.min(1,s))*32767,true));return new Blob([b],{type:'audio/wav'})}
$('record').onclick=async()=>{if(!processor){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});audioContext=new AudioContext();source=audioContext.createMediaStreamSource(stream);processor=audioContext.createScriptProcessor(4096,1,1);chunks=[];processor.onaudioprocess=e=>chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));source.connect(processor);processor.connect(audioContext.destination);$('record').textContent='Stop and transcribe';$('status').innerHTML='<small>Recording locally. Click Stop when finished.</small>'}catch(e){$('status').innerHTML=`<p class="warning">Microphone unavailable: ${e.message}</p>`}}else{processor.disconnect();source.disconnect();stream.getTracks().forEach(t=>t.stop());const length=chunks.reduce((n,c)=>n+c.length,0),samples=new Float32Array(length);let offset=0;chunks.forEach(c=>{samples.set(c,offset);offset+=c.length});processor=null;$('record').disabled=true;$('status').innerHTML='<small>Transcribing locally...</small>';try{const form=new FormData();form.append('audio',wav(samples,audioContext.sampleRate),'debrief.wav');const r=await fetch('/api/transcribe',{method:'POST',body:form});if(!r.ok)throw new Error(await r.text());$('transcript').value=(await r.json()).transcript;$('status').innerHTML='<p class="ok">Local transcript ready. Review it before creating the plan.</p>'}catch(e){$('status').innerHTML=`<p class="warning">${e.message}</p>`}finally{$('record').textContent='Record';$('record').disabled=false}}};
</script></body></html>

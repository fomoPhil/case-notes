[project]
name = "debrief"
version = "0.1.0"
description = "Local voice-to-action documentation copilot for therapists"
requires-python = ">=3.10"
dependencies = [
  "dateparser>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "python-dateutil>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.30,<1",
  "parakeet-mlx>=0.3; platform_system == 'Darwin'",
]

[project.optional-dependencies]
pdf = ["weasyprint", "markdown"]

[project.scripts]
debrief = "debrief.__main__:main"
debrief-doctor = "debrief.doctor:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# app.py stays a top-level module at the repo root; the installed console
# scripts add the repo root to sys.path so "app:app" still imports.
packages = ["debrief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

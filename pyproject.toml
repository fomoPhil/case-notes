[project]
name = "debrief"
version = "0.1.0"
description = "Local voice-to-action documentation copilot for therapists"
requires-python = ">=3.10"
dependencies = [
  "dateparser>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "python-dateutil>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.30,<1",
  "mlx-whisper>=0.4,<1; platform_system == 'Darwin'",
]

[project.optional-dependencies]
pdf = ["weasyprint", "markdown"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
